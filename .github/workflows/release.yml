name: Release
on:
  push:
    branches:
      - master
    paths:
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (main, beta, hotfix)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - beta
          - hotfix
      tag_name:
        description: 'Tag name to update (required for hotfix, e.g., v1.2.3)'
        required: false
        type: string
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - windows
          - linux
          - flatpak
          - macos
          - android
          - all
      overwrite:
        description: 'Overwrite existing assets (only for hotfix)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows Build
  # ---------------------------------------------------------------------------
  release-windows:
    runs-on: windows-latest
    if: |
      github.event_name == 'push' ||
      inputs.platform == 'windows' ||
      inputs.platform == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: windows

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Set version and prerelease flags
        id: info
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          # Determine version and prerelease status
          if ($env:GH_EVENT_NAME -eq "push") {
            $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
            $prerelease = $false
            $tagName = "v$version"
          } elseif ($env:INPUT_RELEASE_TYPE -eq "beta") {
            $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version + "-beta"
            $prerelease = $true
            $tagName = "v$version"
          } elseif ($env:INPUT_RELEASE_TYPE -eq "hotfix") {
            $version = $env:INPUT_TAG_NAME.TrimStart('v')
            $prerelease = $false
            if ($env:INPUT_TAG_NAME.StartsWith('v')) {
              $tagName = $env:INPUT_TAG_NAME
            } else {
              $tagName = "v$($env:INPUT_TAG_NAME)"
            }
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
            $prerelease = $false
            $tagName = "v$version"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      - name: Rename artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.info.outputs.version }}"
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Rename-Item -NewName "audion_${ver}_windows.msi"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Rename-Item -NewName "audion_${ver}_windows.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig | Rename-Item -NewName "audion_${ver}_windows.exe.sig"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: ${{ inputs.release_type == 'hotfix' && steps.info.outputs.tag_name || format('v{0}', steps.info.outputs.version) }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/release/bundle/msi/audion_*_windows.msi
            src-tauri/target/release/bundle/nsis/audion_*_windows.exe
            src-tauri/target/release/bundle/nsis/audion_*_windows.exe.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
          TAG_NAME: ${{ steps.info.outputs.tag_name }}
        run: |
          if (-not $env:DISCORD_WEBHOOK_URL) { return }
          $payload = @{
            embeds = @(
              @{
                title = "🪟 Windows build $env:TAG_NAME"
                description = "Windows release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}"
                color = 1947988
                url = "https://github.com/${{ github.repository }}/releases/tag/v$env:VERSION"
              }
            )
          } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -Body $payload -ContentType "application/json"


# ---------------------------------------------------------------------------
# Linux Build — Universal AppImage (GPU-safe, Bazzite/immutable distro compat)
# ---------------------------------------------------------------------------
  release-linux:
    runs-on: ubuntu-22.04        # ← 22.04, NOT 24.04 (older glibc = broader compat)
    needs: release-windows
    if: |
      always() &&
      (github.event_name == 'push' || inputs.platform == 'linux' || inputs.platform == 'all') &&
      (needs.release-windows.result == 'success' || needs.release-windows.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: linux

      - name: Build Tauri app
        run: |
          xvfb-run -a \
            --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            npm run tauri build
        env:
          # kept intentionally: linux OTA auto-update is planned
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Patch AppImage with GPU-safe wrapper script
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then echo "No AppImage found"; exit 1; fi
          echo "Patching: $APPIMAGE"

          # Extract AppImage
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          
          # Inject wrapper that auto-detects GPU environment at runtime
          cat > squashfs-root/AppRun-real << 'WRAPPER_EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"

          # ---------------------------------------------------------------------------
          # GPU / WebKit environment auto-detection
          # Bazzite and other immutable distros may have Wayland-only or broken EGL.
          # ---------------------------------------------------------------------------

          # Always disable dmabuf renderer — it is the most common cause of blank screens on Mesa/NVIDIA
          export WEBKIT_DISABLE_DMABUF_RENDERER=1

          # Wayland detection — prefer X11 fallback for WebKitGTK 4.x stability
          if [ -n "$WAYLAND_DISPLAY" ] && [ -z "$FORCE_WAYLAND" ]; then
            export GDK_BACKEND=x11
            export QT_QPA_PLATFORM=xcb
          fi

          # ALSA/audio safety
          if [ -z "$ALSA_CONFIG_PATH" ] && [ -f /usr/share/alsa/alsa.conf ]; then
            export ALSA_CONFIG_PATH=/usr/share/alsa/alsa.conf
          fi

          # Robust binary detection
          if [ -f "$HERE/usr/bin/Audion" ]; then
            BIN="$HERE/usr/bin/Audion"
          elif [ -f "$HERE/usr/bin/audion" ]; then
            BIN="$HERE/usr/bin/audion"
          else
            BIN=$(find "$HERE/usr/bin" -type f -executable | head -1)
          fi

          exec "$BIN" "$@"
          WRAPPER_EOF

          chmod +x squashfs-root/AppRun-real

          # Back up original AppRun and replace
          if [ -L squashfs-root/AppRun ]; then
            # If it's a symlink, resolve it and move the target
            ORIG_TARGET=$(readlink squashfs-root/AppRun)
            mv "squashfs-root/$ORIG_TARGET" squashfs-root/AppRun-original
            rm squashfs-root/AppRun
          else
            mv squashfs-root/AppRun squashfs-root/AppRun-original
          fi

          cat > squashfs-root/AppRun << 'APPRUN_EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/AppRun-real" "$@"
          APPRUN_EOF
          chmod +x squashfs-root/AppRun

          # Repack the AppImage
          # NOTE: appimagetool is itself an AppImage. GitHub Actions runners do not
          # have libfuse.so.2 (FUSE 2). Setting APPIMAGE_EXTRACT_AND_RUN=1 makes the
          # AppImage runtime self-extract to a tmpdir and exec without FUSE.
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool --no-appstream squashfs-root \
            "src-tauri/target/release/bundle/appimage/audion-patched.AppImage"

          # Clean up extracted dir
          rm -rf squashfs-root

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          VER="${{ steps.info.outputs.version }}"
          # Rename DEB
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          if [ -n "$DEB_FILE" ]; then
            mv "$DEB_FILE" "src-tauri/target/release/bundle/deb/audion_${VER}_linux.deb"
          fi
          # Rename Patched AppImage
          if [ -f src-tauri/target/release/bundle/appimage/audion-patched.AppImage ]; then
            mv src-tauri/target/release/bundle/appimage/audion-patched.AppImage \
               src-tauri/target/release/bundle/appimage/audion_${VER}_linux.AppImage
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: ${{ inputs.release_type == 'hotfix' && steps.info.outputs.tag_name || format('v{0}', steps.info.outputs.version) }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/release/bundle/deb/audion_*_linux.deb
            src-tauri/target/release/bundle/appimage/audion_*_linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"🐧 Linux build v$VERSION\", \"description\": \"Linux release updated\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" \
            "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Flatpak Build
  # ---------------------------------------------------------------------------
  release-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    needs: release-linux
    if: |
      always() &&
      (github.event_name == 'push' || inputs.platform == 'flatpak' || inputs.platform == 'all') &&
      (needs.release-linux.result == 'success' || needs.release-linux.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Configure Flathub remote (system scope)
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --system

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.audion.app.yml
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          bundle: audion_${{ steps.info.outputs.version }}_flatpak.flatpak
          cache-key: flatpak-builder-${{ runner.os }}-${{ hashFiles('packaging/flatpak/*.yml') }}-v1
          install-dependencies: true
          upload-artifact: false
          verbose: true

      - name: Verify Flatpak bundle
        run: |
          ls -la
          ls -la *.flatpak || true
          test -f "audion_${{ steps.info.outputs.version }}_flatpak.flatpak"

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: ${{ inputs.release_type == 'hotfix' && steps.info.outputs.tag_name || format('v{0}', steps.info.outputs.version) }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          overwrite_files: ${{ inputs.overwrite }}
          files: audion_${{ steps.info.outputs.version }}_flatpak.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST -d "{\"embeds\": [{\"title\": \"📦 Flatpak build v$VERSION\", \"description\": \"Flatpak release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # macOS Build
  # ---------------------------------------------------------------------------
  release-macos:
    runs-on: macos-latest
    needs: [release-windows, release-linux, release-flatpak]
    if: |
      always() &&
      (github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'all') &&
      (needs.release-windows.result == 'success' || needs.release-windows.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup (Node, Rust, cache, deps)
        uses: ./.github/actions/setup
        with:
          platform: macos
          rust_targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Tauri app (Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          VER="${{ steps.info.outputs.version }}"
          echo "--- dmg dir ---"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg/ || true
          echo "--- macos dir ---"
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/macos/ || true
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/dmg/audion_${VER}_macos.dmg
          mv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_${VER}_macos.app.tar.gz
          mv src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_${VER}_macos.app.tar.gz.sig

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: ${{ inputs.release_type == 'hotfix' && steps.info.outputs.tag_name || format('v{0}', steps.info.outputs.version) }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/audion_*_macos.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_*_macos.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/audion_*_macos.app.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST -d "{\"embeds\": [{\"title\": \"🍎 macOS build v$VERSION\", \"description\": \"macOS release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" "$DISCORD_WEBHOOK_URL"

  # ---------------------------------------------------------------------------
  # Updater Manifest (latest.json) — Windows + macOS only for now
  # ---------------------------------------------------------------------------
  release-updater-manifest:
    runs-on: ubuntu-latest
    needs: [release-windows, release-macos]
    if: |
      always() &&
      (github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'macos' || inputs.platform == 'all') &&
      needs.release-windows.result == 'success' &&
      needs.release-macos.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download .sig files from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ steps.info.outputs.version }}"
          TAG="v${VER}"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "audion_${VER}_windows.exe.sig" \
            --pattern "audion_${VER}_macos.app.tar.gz.sig" \
            --dir sigs

      - name: Generate latest.json
        run: |
          VER="${{ steps.info.outputs.version }}"
          TAG="v${VER}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES=$(jq -Rs . < releasenote.md)

          WIN_SIG=$(cat "sigs/audion_${VER}_windows.exe.sig")
          MAC_SIG=$(cat "sigs/audion_${VER}_macos.app.tar.gz.sig")

          jq -n \
            --arg version "$TAG" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "https://github.com/${REPO}/releases/download/${TAG}/audion_${VER}_windows.exe" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "https://github.com/${REPO}/releases/download/${TAG}/audion_${VER}_macos.app.tar.gz" \
            '{
              version: $version,
              notes: ($notes | fromjson),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          cat latest.json

      - name: Upload latest.json to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: ${{ inputs.release_type == 'hotfix' && steps.info.outputs.tag_name || format('v{0}', steps.info.outputs.version) }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          overwrite_files: true
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android Build
  # ---------------------------------------------------------------------------
  release-android:
    runs-on: ubuntu-latest
    needs: [release-windows, release-linux, release-macos]
    if: |
      always() &&
      (github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all') &&
      (needs.release-windows.result == 'success' || needs.release-windows.result == 'skipped')
    env:
      GRADLE_OPTS: -Xmx4096m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node and Rust (composite action)
        uses: ./.github/actions/setup
        with:
          platform: android
          rust_targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri
          key: tauri-cli-2.11.0

      - name: Install tauri-cli (if not already)
        run: cargo install tauri-cli --version 2.11.0 --locked

      - name: Setup Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > src-tauri/gen/android/key.properties

      - name: Initialize Android project
        run: npm run tauri android init

      - name: Bundle libc++_shared.so into jniLibs
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/$(ls "${ANDROID_HOME}/ndk" | sort -V | tail -1)"
          # NDK r23+ moved libc++_shared.so out of sysroot/usr/lib/<abi>/
          # It now lives under toolchains/llvm/prebuilt/<host>/lib/ per target triple
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64"
          JNI_DIR="src-tauri/gen/android/app/src/main/jniLibs"
          declare -A ABI_TRIPLE=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86]=i686-linux-android
            [x86_64]=x86_64-linux-android
          )
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            TRIPLE="${ABI_TRIPLE[$ABI]}"
            SO=$(find "${TOOLCHAIN}" -name "libc++_shared.so" -path "*/${TRIPLE}/*" | head -1)
            if [ -z "$SO" ]; then
              echo "ERROR: libc++_shared.so not found for ${ABI} (triple: ${TRIPLE})"
              find "${TOOLCHAIN}" -name "libc++_shared.so" || true
              exit 1
            fi
            mkdir -p "${JNI_DIR}/${ABI}"
            cp "$SO" "${JNI_DIR}/${ABI}/"
            echo "Copied: $SO -> ${JNI_DIR}/${ABI}/"
          done

      - name: Build Tauri app for Android (Signed)
        run: npm run tauri android build

      - name: Verify libc++_shared.so is bundled
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "Checking APK: $APK"
          echo "--- All .so files in APK ---"
          unzip -l "$APK" | grep "\.so" || echo "WARNING: No .so files found at all"
          echo "--- libc++ check ---"
          if unzip -l "$APK" | grep -q "libc++_shared.so"; then
            echo "OK: libc++_shared.so is bundled"
          else
            echo "ERROR: libc++_shared.so NOT FOUND in APK — app will crash at launch"
            exit 1
          fi

      - name: Set version and prerelease flags
        id: info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG_NAME=""
          if [ "$GH_EVENT_NAME" = "push" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          elif [ "$INPUT_RELEASE_TYPE" = "beta" ]; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)-beta
            PRERELEASE=true
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            VERSION=$(echo "$INPUT_TAG_NAME" | sed 's/^v//')
            PRERELEASE=false
            TAG_NAME="$INPUT_TAG_NAME"
            case "$TAG_NAME" in
              v*) ;;
              *) TAG_NAME="v$TAG_NAME" ;;
            esac
          else
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
            PRERELEASE=false
          fi
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v$VERSION"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Rename Android artifacts
        run: |
          VER="${{ steps.info.outputs.version }}"
          # Universal APK path (most common)
          UNIVERSAL_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ -f "$UNIVERSAL_APK" ]; then
            mv "$UNIVERSAL_APK" "src-tauri/gen/android/app/build/outputs/apk/audion_${VER}_android.apk"
            echo "APK renamed to audion_${VER}_android.apk"
          else
            # Fallback: search for any APK in release directories
            APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
            if [ -n "$APK_FILE" ]; then
              mv "$APK_FILE" "src-tauri/gen/android/app/build/outputs/apk/audion_${VER}_android.apk"
              echo "APK renamed to audion_${VER}_android.apk"
            else
              echo "No APK found"
              exit 1
            fi
          fi

      - name: Upload Android artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.version }}
          name: ${{ inputs.release_type == 'hotfix' && steps.info.outputs.tag_name || format('v{0}', steps.info.outputs.version) }}
          body_path: releasenote.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          overwrite_files: ${{ inputs.overwrite }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/audion_*_android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -H "Content-Type: application/json" -X POST -d "{\"embeds\": [{\"title\": \"🤖 Android build v$VERSION\", \"description\": \"Android release has been ${{ github.event_name == 'push' && 'created' || 'updated' }}\", \"color\": 1947988, \"url\": \"https://github.com/${{ github.repository }}/releases/tag/v$VERSION\"}]}" "$DISCORD_WEBHOOK_URL"